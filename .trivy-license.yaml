# License policy for `make license` — the table in docs/dependencies.md; change both together.
# trivy maps: forbidden → CRITICAL, restricted → HIGH, anything not listed → UNKNOWN; the check fails on all three.
license:
  permissive:
    - MIT
    - MIT-0
    - ISC
    - BSD-2-Clause
    - BSD-3-Clause
    - 0BSD
    - Apache-2.0
    - Zlib
    - BlueOak-1.0.0
    - Python-2.0
    - PSF-2.0
    - CC-BY-4.0
    - OFL-1.1
    - MPL-2.0
  unencumbered:
    - Unlicense
    - CC0-1.0
  restricted:
    - LGPL-2.1
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0
    - LGPL-3.0-only
    - LGPL-3.0-or-later
    - EPL-2.0
    - CDDL-1.0
  forbidden:
    - GPL-2.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-3.0
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
    - BUSL-1.1
    - Elastic-2.0
    - CC-BY-NC-4.0
    - CC-BY-NC-SA-4.0
